# Smithery configuration for mcp-server-zuuna (stdio server, installed via npx).
# Docs: https://smithery.ai/docs
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      zuunaApiToken:
        type: string
        title: Zuuna API Token
        description: Bearer API token from your Zuuna workspace. Grant only the scopes the agent needs (boards:read + cards:read is enough for a read-only observer).
      zuunaBaseUrl:
        type: string
        title: Zuuna Base URL
        description: Base URL of your Zuuna instance.
        default: https://app.zuuna.de
      zuunaTimeoutMs:
        type: number
        title: Request Timeout (ms)
        description: Per-request timeout in milliseconds.
        default: 15000
    required:
      - zuunaApiToken
  commandFunction:
    |-
      (config) => ({
        "command": "npx",
        "args": ["-y", "mcp-server-zuuna"],
        "env": {
          "ZUUNA_API_TOKEN": config.zuunaApiToken,
          "ZUUNA_BASE_URL": config.zuunaBaseUrl || "https://app.zuuna.de",
          ...(config.zuunaTimeoutMs ? { "ZUUNA_TIMEOUT_MS": String(config.zuunaTimeoutMs) } : {})
        }
      })
